name: pc-state-mqtt-test

services:
  mqtt:
    image: eclipse-mosquitto:2.0.22
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MQTT_TEST_PORT:-1883}:1883"
    volumes:
      - ./test/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test:
        - CMD-SHELL
        - grep -qx mosquitto /proc/1/comm
      interval: 5s
      timeout: 4s
      retries: 5
      start_period: 2s